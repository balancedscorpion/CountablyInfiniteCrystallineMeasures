    "name": "A complete crystalline-measure space of countably infinite Hamel dimension",
    "description": "There exists a locally finite set Λ in the real line such that the complete complex vector space of tempered distributions locally given by atomic measures on Λ, whose distributional Fourier transforms are also locally atomic on Λ, has Hamel dimension ℵ₀. A countable family gives a unique finite linear expansion of every admissible distribution, and every finite expansion is admissible. The theorem includes the equivalence between a Schwartz-vanishing-ideal definition and the local atomic formulas on both Fourier sides. Temperedness is distributional; no additional polynomial total-variation bound is assumed. This is an exhaustive occurrence result for one constructed carrier, not a classification of arbitrary carriers.",
